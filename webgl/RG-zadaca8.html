<!doctype html>
<html lang="hr">
	<head>
		<meta charset="UTF-8">
		<title>WebGL2 - zad 8</title>
		<script src="js/RG-WebGL.js"></script>
        <script src="js/gks2d.js"></script>
        <script src="js/mt2d.js"></script>
		<script src="js/utility.js"></script>
        <script src="js/crtanje_3d.js"></script>
        <script src="js/gks3d.js"></script>
        <script src="js/mt3d.js"></script>
        <script src="js/gks3d_pers.js"></script>

      <script src="js/crtanje_webgl.js"></script>

		<script>
		  window.onload = WebGLaplikacija;

		  function WebGLaplikacija() {
        var platno1 = document.getElementById("slika1");
        gl = platno1.getContext("webgl2");
        if (!gl) alert("WebGL2 nije dostupan!");

        GPUprogram1 = pripremiGPUprogram(gl, "vertex-shader", "fragment-shader");
        gl.useProgram(GPUprogram1); // možemo imati više GPU programa

        let crtac = new CrtanjeWebGL();
        let mat = new MT3D();

        GPUprogram1.a_vrhXY = gl.getAttribLocation(GPUprogram1, "a_vrhXY");
        GPUprogram1.a_boja = gl.getAttribLocation(GPUprogram1, "a_boja");
        GPUprogram1.u_mTrans = gl.getUniformLocation(GPUprogram1, "u_mTrans");

        const grid = crtac.vratiVrhoveGrid(-5, 5, 0.5, [0.7, 0.7, 0.7]);
       
        // definiranje geometrije preko javascript polja
        let a = 1;

            const kocka_vrhovi = [
                // prednja (z = +a) - crvena
                [-a,-a,a, 1,0,0], [a,-a,a, 1,0,0], [a,a,a, 1,0,0],
                [-a,-a,a, 1,0,0], [a,a,a, 1,0,0], [-a,a,a, 1,0,0],
                // stražnja (z = -a) - zelena
                [-a,-a,-a, 0,1,0], [a,-a,-a, 0,1,0], [a,a,-a, 0,1,0],
                [-a,-a,-a, 0,1,0], [a,a,-a, 0,1,0], [-a,a,-a, 0,1,0],
                // lijeva (x = -a) - plava
                [-a,-a,-a, 0,0,1], [-a,-a,a, 0,0,1], [-a,a,a, 0,0,1],
                [-a,-a,-a, 0,0,1], [-a,a,a, 0,0,1], [-a,a,-a, 0,0,1],
                // desna (x = +a) - žuta
                [a,-a,-a, 1,1,0], [a,-a,a, 1,1,0], [a,a,a, 1,1,0],
                [a,-a,-a, 1,1,0], [a,a,a, 1,1,0], [a,a,-a, 1,1,0],
                // gornja (y = +a) - magenta
                [-a,a,-a, 1,0,1], [-a,a,a, 1,0,1], [a,a,a, 1,0,1],
                [-a,a,-a, 1,0,1], [a,a,a, 1,0,1], [a,a,-a, 1,0,1],
                // donja (y = -a) - cyan
                [-a,-a,-a, 0,1,1], [-a,-a,a, 0,1,1], [a,-a,a, 0,1,1],
                [-a,-a,-a, 0,1,1], [a,-a,a, 0,1,1], [a,-a,-a, 0,1,1],
            ];
        
        function napravi_spremnik(vrhovi) {
          let noviSpremnikVrhova = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, noviSpremnikVrhova);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vrhovi.flat()), gl.STATIC_DRAW);
    
          return { buffer: noviSpremnikVrhova, count: vrhovi.length };
        }

  
      
    function bind_postavi_nacrtaj_lines(buffer){
     
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer.buffer);
       gl.enableVertexAttribArray(GPUprogram1.a_vrhXY);
      gl.enableVertexAttribArray(GPUprogram1.a_boja);
      gl.vertexAttribPointer(GPUprogram1.a_vrhXY, 3, gl.FLOAT, false, 24, 0);
      gl.vertexAttribPointer(GPUprogram1.a_boja, 3, gl.FLOAT, false, 24, 12);

      gl.drawArrays(gl.LINES, 0, buffer.count / 6);

    }

    function bind_postavi_nacrtaj_triangles(buffer){
  
       gl.bindBuffer(gl.ARRAY_BUFFER, buffer.buffer);
       gl.enableVertexAttribArray(GPUprogram1.a_vrhXY);
      gl.enableVertexAttribArray(GPUprogram1.a_boja);
      gl.vertexAttribPointer(GPUprogram1.a_vrhXY, 3, gl.FLOAT, false, 24, 0);
      gl.vertexAttribPointer(GPUprogram1.a_boja, 3, gl.FLOAT, false, 24, 12);

      gl.drawArrays(gl.TRIANGLES, 0, buffer.count);

    }

    function animacija() {
           gl.viewport(0, 0, platno1.width, platno1.height);
          gl.clearColor(0.2, 0.2, 0.2, 1);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
          
          mat.rotirajY(0.01);
          mat.rotirajX(0.02);
          mat.postaviKameru(5, 5, 8, 0, 0, 0, 0, 1, 0);
          // prednja pa straznja
          mat.persp(-10, 10, -10, 10, 5, 40);

          gl.uniformMatrix4fv(GPUprogram1.u_mTrans, false, mat.lista());
        
          
          bind_postavi_nacrtaj_triangles(kocka_buffer);
          bind_postavi_nacrtaj_lines(grid_buffer);
          
        
          requestAnimationFrame(animacija);
          }
     

        
        let kocka_buffer = napravi_spremnik(kocka_vrhovi);
        let grid_buffer = napravi_spremnik(grid);

        gl.enable(gl.DEPTH_TEST);
        //gl.enable(gl.CULL_FACE);
        //gl.cullFace(gl.BACK);
        //gl.frontFace(gl.CCW);

        animacija();
   
      } // WebGLaplikacija
	</script>

	<script id="vertex-shader" type="x-shader/x-vertex">
      #version 300 es
          in vec3 a_vrhXY;
          in vec3 a_boja;

          uniform mat4 u_mTrans;

          out vec3 v_boja;

          void main() {
            gl_Position = u_mTrans * vec4(a_vrhXY, 1.0);
            v_boja = a_boja;
      }

    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
      #version 300 es
      precision highp float;
      in vec3 v_boja;
      out vec4 bojaPiksela;

      void main() {
        bojaPiksela = vec4(v_boja, 1);
      }
    </script>
	</head>

	<body>
		<h1>WebGL2 - zad 8</code></h1>
		<div>
			<canvas id="slika1" width="500" height="500" style="border:5px solid black">
				Vaš preglednik ne podržava HTML5 canvas.
      </canvas>
		</div>
	</body>
</html>

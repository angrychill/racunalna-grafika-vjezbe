<!doctype html>
<html lang="hr">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta charset="UTF-8" />
    <title>Zadaca 9</title>
    <script src="RG-WebGL.js"></script>
    <script src="mt3d.js"></script>
    <script src="shapes3d.js"></script>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        margin: 0;
        padding: 16px;
        background: #f5f5f5;

        margin: 0 0 16px;
      }

        margin: 16px 0 8px;
      }

        display: flex;
        align-items: flex-start;
        gap: 12px;
        max-width: 760px;
      }
      canvas {
        border: 4px solid #000;
        width: 100%;
        max-width: 700px;
        height: auto;
        background: #000;
      }
      .hint {
        font-size: 0.9rem;
        color: #555;
        margin: 0 0 8px;
      }
    </style>

    <script>
      window.onload = WebGL2aplikacija;

      function WebGL2aplikacija() {
        const platno1 = document.getElementById("slika1");
        const gl = platno1.getContext("webgl2");
        if (!gl) {
          alert("WebGL2 nije dostupan!");
          return;
        }

        const GPUprog1 = pripremiGPUprogram(
          gl,
          "vertex-shader",
          "fragment-shader",
        );
        gl.useProgram(GPUprog1);

        // atributi
        GPUprog1.a_vrhXYZ = gl.getAttribLocation(GPUprog1, "a_vrhXYZ");
        GPUprog1.a_normala = gl.getAttribLocation(GPUprog1, "a_normala");

        // uniform varijable
        GPUprog1.u_mTrans = gl.getUniformLocation(GPUprog1, "u_mTrans"); // view-projection
        GPUprog1.u_model = gl.getUniformLocation(GPUprog1, "u_model"); // model matrica
        GPUprog1.u_izvorXYZ = gl.getUniformLocation(GPUprog1, "u_izvorXYZ");
        GPUprog1.u_kameraXYZ = gl.getUniformLocation(GPUprog1, "u_kameraXYZ");
        GPUprog1.u_boja = gl.getUniformLocation(GPUprog1, "u_boja");
        GPUprog1.u_objColor = gl.getUniformLocation(GPUprog1, "u_objColor");

        // MT3D instanca za model + kamera + projekcija
        const mt = new MT3D();

        // inicijaliziraj biblioteku oblika s injektiranom MT3D instancom
        const Shapes3D = createShapes3D(mt);

        // napravi oblike iz biblioteke
        const seg = 32;
        const cone = Shapes3D.createCone(1, 2, seg);
        const cylinder = Shapes3D.createCylinder(0.3, 0.6, seg);
        const cylinderHand = Shapes3D.createCylinder(0.1, 1, seg);
        const hemisphere = Shapes3D.createHemisphere(0.3, 16, seg);

        // boje pojedinih objekata (RGB 0-1)
        cylinder.setColor(0.2, 0.6, 1.0); // plavkasti valjak
        cone.setColor(1.0, 0.5, 0.2); // narančasti stožac
        cylinderHand.setColor(1, 0, 0);
        hemisphere.setColor(1.0, 1.0, 0.4); // žućkasta polulopta

        // pripremi spremnike vrhova – svaka instanca oblika vodi svoj buffer
        cylinder.createBuffer(gl);
        cone.createBuffer(gl);
        hemisphere.createBuffer(gl);

        gl.enable(gl.DEPTH_TEST);
        // gl.enable(gl.CULL_FACE);

        let alpha = 0;
        let lightAngle = 0;
        let camAngle = 0;

        function iscrtaj() {
          gl.clearColor(0.1, 0.1, 0.1, 1);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
          gl.viewport(0, 0, platno1.width, platno1.height);

          // kamera oko scene pomoću MT3D
          const camRadius = 4;
          const camX = camRadius; // * Math.sin(camAngle);
          const camZ = camRadius; // * Math.cos(camAngle);
          const camY = 1.5;

          mt.resetirajKameru();
          mt.resetirajProjekciju();
          // MT3D postavlja kameru (pogled prema centru scene)
          mt.postaviKameru(camX, camY, camZ, 0, 0, 0, 0, 1, 0);
          mt.persp(-2, 2, -2, 2, 2, 20);

          // view-projection matrica (P * K) – ista za sve objekte
          const vpLista = new Float32Array(mt.viewProjLista());
          gl.uniformMatrix4fv(GPUprog1.u_mTrans, false, vpLista);

          // pozicija kamere u svijetu (za refleksiju)
          gl.uniform3fv(GPUprog1.u_kameraXYZ, [camX, camY, camZ]);

          const lightRadius = 1;
          const lx = lightRadius; //* Math.sin(lightAngle);
          const lz = lightRadius; //* Math.cos(lightAngle);
          gl.uniform3fv(GPUprog1.u_izvorXYZ, [1.0, 2.0, 1.0]);

          // bijelo svjetlo (dijeljeno za sve oblike)
          gl.uniform3fv(GPUprog1.u_boja, [1.0, 1.0, 1.0]);

          // raspored oblika (svi dijele isto svjetlo i kameru)
          cylinder.draw(gl, GPUprog1, (mtLocal) => {
            mtLocal.pomakni(0, 0.75, 0);
            mtLocal.rotirajY(alpha);
          });
          cone.draw(gl, GPUprog1, (mtLocal) => {
            mtLocal.pomakni(0, 0, 0);
          });
          // tri para (cylinderHand + hemisphere) jednako razmaknuta oko vertikalne osi
          const pairCount = 3;
          const angleStep = 360 / pairCount;
          for (let i = 0; i < pairCount; i++) {
            const pairAngle = i * angleStep;

            cylinderHand.draw(gl, GPUprog1, (mtLocal) => {
              mtLocal.rotirajY(pairAngle);
              mtLocal.rotirajX(90);
              mtLocal.rotirajZ(alpha);
              mtLocal.pomakni(0, -0.5, -0.75);
            });

            hemisphere.draw(gl, GPUprog1, (mtLocal) => {
              mtLocal.rotirajY(pairAngle);
              mtLocal.rotirajZ(90);
              mtLocal.rotirajX(180);
              mtLocal.rotirajX(-alpha);
              mtLocal.pomakni(0.75, 0, 1.25);
            });
          }

          alpha += 0.7; // rotacija oblika
          lightAngle += 0.02; // kretanje izvora svjetlosti
          camAngle += 0.01; // kretanje kamere oko scene

          requestAnimationFrame(iscrtaj);
        }

        iscrtaj();
      }
    </script>

    <script id="vertex-shader" type="x-shader/x-vertex">
      #version 300 es
      in vec4 a_vrhXYZ;
      in vec3 a_normala;
      uniform mat4 u_mTrans;   // view-projection (P * K)
      uniform mat4 u_model;    // model matrica (M)
      uniform vec3 u_izvorXYZ;
      uniform vec3 u_kameraXYZ;
      out float v_svjetlina;

      void main() {
        // pozicija vrha u svjetskom koordinatnom sustavu
        vec4 worldPos = u_model * a_vrhXYZ;
        vec3 normala = mat3(u_model) * a_normala; // transformacija normale u svijetu

        // Lambertov zakon
        vec3 premaIzvoru = normalize(u_izvorXYZ - worldPos.xyz);
        v_svjetlina = dot(premaIzvoru, normala);

        // zakon refleksije
        float refleksija = 0.0;
        if (v_svjetlina > 0.0) {
          vec3 premaKameri = normalize(u_kameraXYZ - worldPos.xyz);
          vec3 reflektiranaZraka = reflect(-premaIzvoru, normala);
          refleksija = max(dot(reflektiranaZraka, premaKameri), 0.0);
          refleksija = pow(refleksija, 8.0);
        }

        v_svjetlina = v_svjetlina * 0.5 + refleksija * 0.5;
        gl_Position = u_mTrans * worldPos;
      }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
      #version 300 es
      precision highp float;
      uniform vec3 u_boja;
      uniform vec3 u_objColor;
      in float v_svjetlina;
      out vec4 bojaFragmenta;

      void main() {
        vec3 boja = v_svjetlina * u_boja * u_objColor;
        bojaFragmenta = vec4(boja, 1.0); // postavlja se boja fragmenta
      }
    </script>
  </head>

  <body>
    <h1>Lambert i refleksija</h1>
    <div>
      <canvas
        id="slika1"
        width="500"
        height="500"
        style="border: 5px solid black"
      >
        Vaš preglednik ne podržava HTML5 canvas.
      </canvas>
    </div>
  </body>

<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta charset="UTF-8" />
    <title>Zadaca 8</title>
    <script src="RG-WebGL.js"></script>
    <script src="mt3d.js"></script>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        margin: 0;
        padding: 16px;
        background: #f5f5f5;
      }
      h1 {
        margin: 0 0 16px;
      }
      h2 {
        margin: 16px 0 8px;
      }
      .canvas-row {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        max-width: 760px;
      }
      canvas {
        border: 4px solid #000;
        width: 100%;
        max-width: 700px;
        height: auto;
        background: #000;
      }
      .hint {
        font-size: 0.9rem;
        color: #555;
        margin: 0 0 8px;
      }
    </style>

    <script>
      // Zajednicka geometrija (mreza + kocka)

      let prikaziMrezu = true;

      function stvoriMrezuXY(gridDim = 8, boja = [0.4, 0.4, 0.4]) {
        const vrhovi = [];
        const c = boja;
        const cMin = -gridDim;
        const cMax = gridDim;

        for (let s = -gridDim; s <= gridDim; s++) {
          vrhovi.push(cMin, s, 0, c[0], c[1], c[2]);
          vrhovi.push(cMax, s, 0, c[0], c[1], c[2]);
          vrhovi.push(s, cMin, 0, c[0], c[1], c[2]);
          vrhovi.push(s, cMax, 0, c[0], c[1], c[2]);
        }

        return new Float32Array(vrhovi);
      }

      function stvoriKockuSaStranicama(a = 1) {
        const v = [];
        const h = a / 2;

        const CRVENA = [1, 0, 0];
        const MAGENTA = [1, 0, 1];
        const PLAVA = [0, 0, 1];
        const Cijan = [0, 1, 1];
        const ZELENA = [0, 1, 0];
        const ZUTA = [1, 1, 0];

        function dodajTrokut(x1, y1, z1, c1, x2, y2, z2, c2, x3, y3, z3, c3) {
          v.push(
            x1,
            y1,
            z1,
            c1[0],
            c1[1],
            c1[2],
            x2,
            y2,
            z2,
            c2[0],
            c2[1],
            c2[2],
            x3,
            y3,
            z3,
            c3[0],
            c3[1],
            c3[2]
          );
        }

        // prednja (z = -h)
        dodajTrokut(-h, -h, -h, CRVENA, h, -h, -h, CRVENA, h, h, -h, CRVENA);
        dodajTrokut(-h, -h, -h, CRVENA, h, h, -h, CRVENA, -h, h, -h, CRVENA);

        // straznja (z = +h)
        dodajTrokut(-h, -h, h, MAGENTA, -h, h, h, MAGENTA, h, h, h, MAGENTA);
        dodajTrokut(-h, -h, h, MAGENTA, h, h, h, MAGENTA, h, -h, h, MAGENTA);

        // lijeva (x = -h)
        dodajTrokut(-h, -h, h, PLAVA, -h, -h, -h, PLAVA, -h, h, -h, PLAVA);
        dodajTrokut(-h, -h, h, PLAVA, -h, h, -h, PLAVA, -h, h, h, PLAVA);

        // desna (x = +h)
        dodajTrokut(h, -h, h, Cijan, h, h, h, Cijan, h, h, -h, Cijan);
        dodajTrokut(h, -h, h, Cijan, h, h, -h, Cijan, h, -h, -h, Cijan);

        // gornja (y = +h)
        dodajTrokut(-h, h, h, ZELENA, -h, h, -h, ZELENA, h, h, -h, ZELENA);
        dodajTrokut(-h, h, h, ZELENA, h, h, -h, ZELENA, h, h, h, ZELENA);

        // donja (y = -h)
        dodajTrokut(-h, -h, h, ZUTA, h, -h, h, ZUTA, h, -h, -h, ZUTA);
        dodajTrokut(-h, -h, h, ZUTA, h, -h, -h, ZUTA, -h, -h, -h, ZUTA);

        return new Float32Array(v);
      }

      // Pozicije (centri) osam kocaka koje tvore slovo F
      function pozicijeSlovaF(a = 1) {
        const p = [];
        // vertikalni stupac
        for (let i = 0; i < 5; i++) {
          const ox = -0.5 * a;
          const oy = i * a;
          const oz = -0.5 * a;
          p.push({ x: ox + a / 2, y: oy + a / 2, z: oz + a / 2 });
        }
        // gornja vodoravna crta
        for (let j = 0; j < 2; j++) {
          const ox = (0.5 + j) * a;
          const oy = 4 * a;
          const oz = -0.5 * a;
          p.push({ x: ox + a / 2, y: oy + a / 2, z: oz + a / 2 });
        }
        // srednja crta
        {
          const ox = 0.5 * a;
          const oy = 2 * a;
          const oz = -0.5 * a;
          p.push({ x: ox + a / 2, y: oy + a / 2, z: oz + a / 2 });
        }
        return p;
      }

      function pripremiScene(gl) {
        const program = pripremiGPUprogram(
          gl,
          "vertex-shader",
          "fragment-shader"
        );
        gl.useProgram(program);

        program.a_vrhXYZ = gl.getAttribLocation(program, "a_vrhXYZ");
        program.a_boja = gl.getAttribLocation(program, "a_boja");
        program.u_mTrans = gl.getUniformLocation(program, "u_mTrans");

        gl.enable(gl.DEPTH_TEST);
        // ne ukljucujemo CULL_FACE kako bi se sve stranice kocke crtale

        return program;
      }

      function napuniSpremnik(gl, data) {
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
        return buffer;
      }

      function postaviAtribute(gl, program) {
        gl.enableVertexAttribArray(program.a_vrhXYZ);
        gl.enableVertexAttribArray(program.a_boja);
        const stride = 6 * 4;
        gl.vertexAttribPointer(program.a_vrhXYZ, 3, gl.FLOAT, false, stride, 0);
        gl.vertexAttribPointer(
          program.a_boja,
          3,
          gl.FLOAT,
          false,
          stride,
          3 * 4
        );
      }

      // Animacija visine kamere
      function animatedY(t, amplitude = 3, offset = 5) {
        const float = Math.sin(t * 0.8) * 0.5;
        const wobble = Math.sin(t * 3.1) * 0.12;
        const drift = Math.sin(t * 0.23) * Math.sin(t * 0.07) * 0.4;
        return offset + amplitude * (float + wobble + drift);
      }

      function pokreniZadaca8_F() {
        const platno = document.getElementById("slikaF");
        if (!platno) return;
        const gl = platno.getContext("webgl2");
        if (!gl) {
          alert("WebGL2 nije dostupan!");
          return;
        }

        const program = pripremiScene(gl);

        const mrezaData = stvoriMrezuXY(8, [0.5, 0.2, 0.2]);
        const kockaData = stvoriKockuSaStranicama(1);
        const mrezaBuffer = napuniSpremnik(gl, mrezaData);
        const kockaBuffer = napuniSpremnik(gl, kockaData);
        const brojMrezaVrhova = mrezaData.length / 6;
        const brojKockaVrhova = kockaData.length / 6;

        const pozicijeF = pozicijeSlovaF(1);

        const mt = new MT3D();
        let prosloVrijeme = 0;

        function iscrtaj(vrijeme) {
          if (!vrijeme) vrijeme = 0;
          const dt = (vrijeme - prosloVrijeme) / 1000;
          prosloVrijeme = vrijeme;
          const t = vrijeme / 1000;

          gl.viewport(0, 0, platno.width, platno.height);
          gl.clearColor(0.02, 0.02, 0.05, 1);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

          const camDist = 6;
          const eyeX = Math.sin(t * 0.4) * camDist;
          const eyeZ = Math.cos(t * 0.4) * camDist;
          const eyeY = animatedY(t, 3, 5);

          mt.resetirajKameru();
          mt.resetirajProjekciju();

          mt.postaviKameru(eyeX, eyeY, eyeZ, 0, 2, 0, 0, 1, 0);
          mt.persp(-4, 4, -4, 4, 3, 30);

          // mreza (po potrebi)
          if (prikaziMrezu) {
            mt.identitet();
            let listaMreza = new Float32Array(mt.lista());
            gl.uniformMatrix4fv(program.u_mTrans, false, listaMreza);

            gl.bindBuffer(gl.ARRAY_BUFFER, mrezaBuffer);
            postaviAtribute(gl, program);
            gl.drawArrays(gl.LINES, 0, brojMrezaVrhova);
          }

          // slovo F
          gl.bindBuffer(gl.ARRAY_BUFFER, kockaBuffer);
          postaviAtribute(gl, program);

          for (const p of pozicijeF) {
            mt.identitet();
            mt.pomakni(p.x, p.y, p.z);
            const lista = new Float32Array(mt.lista());
            gl.uniformMatrix4fv(program.u_mTrans, false, lista);
            gl.drawArrays(gl.TRIANGLES, 0, brojKockaVrhova);
          }

          requestAnimationFrame(iscrtaj);
        }

        requestAnimationFrame(iscrtaj);
      }

      window.onload = function () {
        const cb = document.getElementById("toggleGrid");
        if (cb) {
          prikaziMrezu = cb.checked;
          cb.addEventListener("change", function (e) {
            prikaziMrezu = !!e.target.checked;
          });
        }
        pokreniZadaca8_F();
      };
    </script>

    <script id="vertex-shader" type="x-shader/x-vertex">
      #version 300 es
      in vec3 a_vrhXYZ;
      in vec3 a_boja;
      uniform mat4 u_mTrans;
      out vec3 v_boja;

      void main() {
        gl_Position = u_mTrans * vec4(a_vrhXYZ, 1.0);
        v_boja = a_boja;
      }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
      #version 300 es
      precision highp float;
      in vec3 v_boja;
      out vec4 bojaPiksela;

      void main() {
        bojaPiksela = vec4(v_boja, 1.0);
      }
    </script>
  </head>

  <body>
    <h1>Zadaca 8 - Slovo F</h1>
    <section>
      <div class="canvas-row">
        <canvas id="slikaF" width="700" height="700">
          Vas preglednik ne podrzava HTML5 canvas.
        </canvas>
        <label style="white-space: nowrap; user-select: none">
          <input type="checkbox" id="toggleGrid" checked />
          Prikazi mrezu
        </label>
      </div>
    </section>
  </body>
</html>

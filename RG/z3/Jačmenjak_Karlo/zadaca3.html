<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta charset="UTF-8" />
    <title>Zadaća 3 – Zadatak 1 i 2</title>
    <script src="otho.js"></script>
    <script src="mt3d.js"></script>
    <style>
      body {
        font-family: system-ui, Arial, sans-serif;
        margin: 0;
        padding: 16px;
      }
      h2 {
        margin: 12px 0 8px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }
      @media (min-width: 1100px) {
        .row {
          grid-template-columns: 1fr 1fr;
        }
      }
      canvas {
        border: 4px solid #000;
        width: 100%;
        max-width: 640px;
        height: auto;
      }
      .hint {
        color: #555;
        font-size: 0.9rem;
        margin: 0 0 8px;
      }
    </style>
    <script>
      function linija3D(ort, x1, y1, z1, x2, y2, z2, boja) {
        if (boja) ort.koristiBoju(boja);
        ort.postaviNa(x1, y1, z1);
        ort.linijaDo(x2, y2, z2);
        ort.povuciLiniju();
      }

      function kockaNa(ort, a, ox, oy, oz, boja) {
        const V = [
          [ox, oy, oz],
          [ox + a, oy, oz],
          [ox + a, oy + a, oz],
          [ox, oy + a, oz],
          [ox, oy, oz + a],
          [ox + a, oy, oz + a],
          [ox + a, oy + a, oz + a],
          [ox, oy + a, oz + a],
        ];
        const E = [
          [0, 1],
          [1, 2],
          [2, 3],
          [3, 0],
          [4, 5],
          [5, 6],
          [6, 7],
          [7, 4],
          [0, 4],
          [1, 5],
          [2, 6],
          [3, 7],
        ];
        ort.koristiBoju("black");
        for (const [i, j] of E) {
          const [x1, y1, z1] = V[i],
            [x2, y2, z2] = V[j];
          ort.postaviNa(x1, y1, z1);
          ort.linijaDo(x2, y2, z2);
          ort.povuciLiniju();
        }
      }

      function cloneMat(M) {
        const c = new MT3D();
        c._matrica = M._matrica.map((r) => r.slice());
        return c;
      }

      // ZADATAK 1 – Rotacija kocke oko zadane osi + označene pozitivne osi
      function initZadatak1() {
        const canvas = document.getElementById("c1");
        const ort = Ortho.EqualX(canvas, -10, 10);

        const P1 = { x: 2, y: -5, z: 2 };
        const P2 = { x: -3, y: 5, z: -3 };
        const U = { x: P2.x - P1.x, y: P2.y - P1.y, z: P2.z - P1.z };

        const Base = new MT3D();
        Base.rotiraj_oko_osi(P1.x, P1.y, P1.z, U.x, U.y, U.z, 30);

        let kut = 0;
        const brzina = -30; // °/s
        let last = performance.now();

        function crtajOsiPozitivne() {
          const L = 6;
          ort.koristiBoju("red");
          linija3D(ort, 0, 0, 0, L, 0, 0);
          ort.koristiBoju("green");
          linija3D(ort, 0, 0, 0, 0, L, 0);
          ort.koristiBoju("blue");
          linija3D(ort, 0, 0, 0, 0, 0, -L);
        }

        function crtajOsRotacije() {
          const len = Math.hypot(U.x, U.y, U.z) || 1;
          const ux = U.x / len,
            uy = U.y / len,
            uz = U.z / len;
          const L = 30;
          const A = { x: P1.x - ux * L, y: P1.y - uy * L, z: P1.z - uz * L };
          const B = { x: P1.x + ux * L, y: P1.y + uy * L, z: P1.z + uz * L };
          linija3D(ort, A.x, A.y, A.z, B.x, B.y, B.z, "magenta");
        }

        function frame(now) {
          const dt = (now - last) / 1000;
          last = now;
          kut = (kut + brzina * dt) % 360;

          ort.ocistiCanvas();
          ort.trans(Base);
          crtajOsiPozitivne();
          crtajOsRotacije();

          const Mc = cloneMat(Base);
          Mc.rotiraj_oko_osi(P1.x, P1.y, P1.z, U.x, U.y, U.z, kut);
          ort.trans(Mc);
          kockaNa(ort, 2, 0, 0, 0, "#222");

          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      // ZADATAK 2 – Astroida (hypocycloid, R=4r, r=1)
      function initZadatak2() {
        const canvas = document.getElementById("c2");
        const ort = Ortho.EqualX(canvas, -5.5, 5.5);
        const r = 1,
          R = 4 * r;
        const tocke = [];
        let t = 0;
        const omega = 1.2;
        let last = performance.now();

        function kruznica(ort, cx, cy, rad, boja) {
          ort.koristiBoju(boja);
          const N = 200;
          let x = cx + rad,
            y = cy;
          ort.postaviNa(x, y, 0);
          for (let i = 1; i <= N; i++) {
            const ang = (i / N) * 2 * Math.PI;
            x = cx + rad * Math.cos(ang);
            y = cy + rad * Math.sin(ang);
            ort.linijaDo(x, y, 0);
          }
          ort.povuciLiniju();
        }

        function frame(now) {
          const dt = (now - last) / 1000;
          last = now;
          t = (t + omega * dt) % (2 * Math.PI);

          ort.ocistiCanvas();
          // velika plava kružnica (R=4)
          kruznica(ort, 0, 0, R, "blue");

          // središte male kružnice
          const Cx = (R - r) * Math.cos(t);
          const Cy = (R - r) * Math.sin(t);

          // mala crna kružnica, središte i radijus prema istaknutoj točki
          kruznica(ort, Cx, Cy, r, "black");
          // središte (točkica)
          ort.koristiBoju("black");
          ort.postaviNa(Cx - 0.05, Cy, 0);
          ort.linijaDo(Cx + 0.05, Cy, 0);
          ort.povuciLiniju();
          ort.postaviNa(Cx, Cy - 0.05, 0);
          ort.linijaDo(Cx, Cy + 0.05, 0);
          ort.povuciLiniju();

          // astroida točka
          const Px = 4 * Math.cos(t) ** 3;
          const Py = 4 * Math.sin(t) ** 3;

          // polumjer male kružnice do istaknute točke (siva linija)
          linija3D(ort, Cx, Cy, 0, Px, Py, 0, "black");

          // trag astroide (crvena)
          tocke.push([Px, Py]);
          ort.koristiBoju("red");
          if (tocke.length > 1) {
            const [x0, y0] = tocke[0];
            ort.postaviNa(x0, y0, 0);
            for (let i = 1; i < tocke.length; i++) {
              const [xi, yi] = tocke[i];
              ort.linijaDo(xi, yi, 0);
            }
            ort.povuciLiniju();
          }

          // istaknuta točka na maloj kružnici
          ort.koristiBoju("red");
          ort.postaviNa(Px - 0.06, Py, 0);
          ort.linijaDo(Px + 0.06, Py, 0);
          ort.povuciLiniju();
          ort.postaviNa(Px, Py - 0.06, 0);
          ort.linijaDo(Px, Py + 0.06, 0);
          ort.povuciLiniju();

          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      window.onload = () => {
        initZadatak1();
        initZadatak2();
      };
    </script>
  </head>
  <body>
    <h1>Zadaća 3</h1>
    <div class="row">
      <section>
        <h2>Zadatak 1 – Rotacija kocke oko zadane osi</h2>
        <canvas id="c1" width="700" height="700"></canvas>
      </section>
      <section>
        <h2>Zadatak 2 – Astroida</h2>
        <canvas id="c2" width="700" height="700"></canvas>
      </section>
    </div>
  </body>
</html>

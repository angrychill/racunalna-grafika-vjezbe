<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta charset="UTF-8" />
    <title>Zadaća 5</title>
    <script src="persp.js"></script>
    <script src="mt3d.js"></script>
    <style>
      body {
        font-family: system-ui, Arial, sans-serif;
        margin: 0;
        padding: 16px;
      }
      .page-nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 8px 0 16px;
      }
      .page-nav a {
        color: #06c;
        text-decoration: none;
        font-weight: 600;
      }
      .page-nav a:hover {
        text-decoration: underline;
      }
      h2 {
        margin: 12px 0 8px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }
      @media (min-width: 1100px) {
        .row {
          grid-template-columns: 1fr 1fr;
        }
      }
      canvas {
        border: 4px solid #000;
        width: 100%;
        max-width: 640px;
        height: auto;
      }
      .hint {
        color: #555;
        font-size: 0.9rem;
        margin: 0 0 8px;
      }
    </style>
    <script>
      function linija3D(persp, x1, y1, z1, x2, y2, z2, boja) {
        if (boja) persp.koristiBoju(boja);
        persp.postaviNa(x1, y1, z1);
        persp.linijaDo(x2, y2, z2);
        persp.povuciLiniju();
      }
      function grid(persp, gridDim) {
        for (let s = -gridDim; s < gridDim + 1; s++) {
          linija3D(persp, -gridDim, 0, s, gridDim, 0, s, "red");
          linija3D(persp, s, 0, -gridDim, s, 0, gridDim, "red");
        }
      }
      function initZadatak1() {
        const platno = document.getElementById("c1");
        if (!platno) {
          alert("Greška - nema platna!");
          return;
        }

        let canvasSize = 10;
        let camDist = 6;
        const persp = Persp.EqualX(platno, -canvasSize, canvasSize, camDist);
        const mt3d = new MT3D();
        let gridDim = 7;
        const zeros = Array(4).fill(0);

        const rotDegrees = 60;
        const rStozac = 3;
        const rKugla = 0.75;
        const rCilindarProp = 0.2;
        const hStozac = 5.5;
        const hCilindarProp = 3;
        const yCilindar = 4.25;

        function frame(now) {
          const t = now / 1000;

          mt3d.identitet();
          mt3d.postaviKameru(3.75, 6.15, 3.75, ...zeros, 1, 0);

          persp.trans(mt3d);
          persp.ocistiCanvas();

          grid(persp, gridDim);
          persp.koristiBoju("black");
          persp.stozac(rStozac, hStozac, 16);

          mt3d.rotiraj_oko_osi(...zeros, 3.5, 0, rotDegrees * t);
          mt3d.pomakni(0, yCilindar, 0);
          persp.trans(mt3d);
          const hCilindar = hStozac - yCilindar;
          persp.valjak(rStozac * (1 - yCilindar / hStozac), hCilindar, 10);
          mt3d.pomakni(0, hCilindar / 2, 0);

          mt3d.rotirajX(90);
          persp.trans(mt3d);
          for (let i = 0; i < 3; i++) {
            mt3d.rotirajZ(120);
            persp.trans(mt3d);
            persp.valjak(rCilindarProp, hCilindarProp, 8);
            mt3d.pomakni(-rCilindarProp, hCilindarProp + rKugla, 0);
            mt3d.rotirajX(-90);
            persp.trans(mt3d);
            persp.kugla(rKugla, 8, 8, true);
            mt3d.rotirajX(90);
            mt3d.pomakni(rCilindarProp, -(hCilindarProp + rKugla), 0);
          }

          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      }

      function initZadatak2() {
        const platno = document.getElementById("c2");
        if (!platno) {
          alert("Greška - nema platna!");
          return;
        }
        const a = 10;
        const camDist = 6;
        const canvasSize = 10;
        const gridDim = 7;
        const mt3d = new MT3D();
        const shift = Math.PI / 2;
        const scale = 2;
        const zeros = Array(4).fill(0);
        const persp = Persp.EqualX(platno, -canvasSize, canvasSize, camDist);

        const uRange = { min: -1, max: 1, step: 1 / 15 };
        const vRange = { min: 0, max: 2 * Math.PI, step: (2 * Math.PI) / 15 };
        function frame(now) {
          const t = now / 1000;
          const x = Math.sin(t);
          const y = (Math.sin(t) + 1) * 3.4 + 0.2;
          const z = Math.cos(t);
          mt3d.identitet();
          mt3d.postaviKameru(x * a, y, z * a, ...zeros, 1, 0);

          persp.ocistiCanvas();
          grid(persp, gridDim);
          mt3d.pomakni(0, shift, 0);
          persp.trans(mt3d);
          mt3d.skaliraj(scale, scale, scale);

          persp.trans(mt3d);
          persp.koristiBoju("black");
          for (let u = uRange.min; u <= uRange.max; u += uRange.step) {
            persp.postaviNa(0, Math.asin(u), u);
            for (let v = vRange.min; v <= vRange.max; v += vRange.step) {
              persp.linijaDo(u * Math.sin(v), Math.asin(u), u * Math.cos(v));
            }
            persp.povuciLiniju();
          }

          for (let v = vRange.min; v <= vRange.max; v += vRange.step) {
            persp.postaviNa(-Math.sin(v), Range.min, -Math.cos(v));
            for (let u = uRange.min; u <= uRange.max; u += uRange.step) {
              persp.linijaDo(u * Math.sin(v), Math.asin(u), u * Math.cos(v));
            }
            persp.povuciLiniju();
          }
          mt3d.pomakni(0, -shift, 0);
          persp.trans(mt3d);
          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      }
      window.onload = () => {
        initZadatak1();
        initZadatak2();
      };
    </script>
  </head>
  <body>
    <div class="row">
      <section id="primjer1">
        <h2>Zadatak 1</h2>
        <canvas id="c1" width="700" height="700"></canvas>
      </section>
      <section id="primjer2">
        <h2>Zadatak 2</h2>
        <canvas id="c2" width="700" height="700"></canvas>
      </section>
    </div>
  </body>
</html>

<!doctype html>
<html lang="hr">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta charset="UTF-8" />
    <title>Kolokvij 2 – predložak</title>
    <script src="../RG-WebGL.js"></script>
    <script src="../mt3d.js"></script>
    <script src="../shapes3d.js"></script>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        margin: 0;
        padding: 16px;
        background: #f5f5f5;
      }
      h1 {
        margin: 0 0 16px;
      }
      canvas {
        border: 4px solid #000;
        width: 100%;
        max-width: 640px;
        height: auto;
        background: #000;
        display: block;
      }
    </style>

    <script>
      // Osnovni kostur WebGL2 aplikacije za zadatke s kolokvija.
      // U svakoj zadaci nadopunjavaš:
      //  - pripremu spremnika (VBO / atributi)
      //  - MT3D transformacije (kamera, projekcija, model)
      //  - postavljanje izvora svjetla i boje
      //  - pozive gl.drawArrays / gl.drawElements

      window.onload = WebGL2aplikacija;

      function WebGL2aplikacija() {
        const platno1 = document.getElementById("slika1");
        const gl = platno1.getContext("webgl2");
        if (!gl) {
          alert("WebGL2 nije dostupan!");
          return;
        }

        const GPUprog1 = pripremiGPUprogram(
          gl,
          "vertex-shader",
          "fragment-shader",
        );
        gl.useProgram(GPUprog1);

        // atributi
        GPUprog1.a_vrhXYZ = gl.getAttribLocation(GPUprog1, "a_vrhXYZ");
        GPUprog1.a_normala = gl.getAttribLocation(GPUprog1, "a_normala");

        // uniform varijable
        GPUprog1.u_mTrans = gl.getUniformLocation(GPUprog1, "u_mTrans"); // view-projection
        GPUprog1.u_model = gl.getUniformLocation(GPUprog1, "u_model"); // model matrix
        GPUprog1.u_izvorXYZ = gl.getUniformLocation(GPUprog1, "u_izvorXYZ");
        GPUprog1.u_kameraXYZ = gl.getUniformLocation(GPUprog1, "u_kameraXYZ");
        GPUprog1.u_boja = gl.getUniformLocation(GPUprog1, "u_boja");
        GPUprog1.u_objColor = gl.getUniformLocation(GPUprog1, "u_objColor");

        const mt = new MT3D();
        const shapes = createShapes3D(mt);

        // postavi kameru i projekciju
        const kamera = { x: 0, y: 3, z: 8 };
        mt.postaviKameru(kamera.x, kamera.y, kamera.z, 0, 0, 0, 0, 1, 0);

        const omjer = platno1.width / platno1.height;
        const fovStupnjevi = 60;
        const near = 1;
        const far = 50;
        const top = Math.tan((fovStupnjevi * Math.PI) / 360) * near;
        const bottom = -top;
        const right = top * omjer;
        const left = -right;
        mt.persp(left, right, bottom, top, near, far);

        // priprema geometrije pilule: cilindar + 2 polulopte
        const radijus = 1;
        const visinaCilindra = 2.25;
        const segmenti = 32;

        const cilindar = shapes.createCylinder(
          radijus,
          visinaCilindra,
          segmenti,
        );
        const poluloptaGore = shapes.createHemisphere(radijus, 16, 32);
        const poluloptaDolje = shapes.createHemisphere(radijus, 16, 32);
        const elipsaCillindar = shapes.createEllipticCylinder(
          0.5,
          0.3,
          0.5,
          32,
        );
        const cilindarProp = shapes.createCylinder(0.1, 1, segmenti);
        const triangleProp = shapes.createTriangle(
          [-radijus / 3, 0, 0], // donji vrh na osi y
          [radijus / 3, 0, 0], // gornji vrh na osi y (okomito)
          [0, -radijus, 0], // zrcaljeni vrh u smjeru -x
        );
        const cilindarHollowProp = shapes.createCylinderShell(
          radijus + 0.05,
          0.5,
          segmenti,
        );
        const lineProp = shapes.createLine([-0.1, 0, 0], [0.1, 0, 0]);

        cilindar.setColor(0.75, 0.75, 0);
        poluloptaGore.setColor(0.75, 0.75, 0);
        poluloptaDolje.setColor(0.75, 0.75, 0);
        elipsaCillindar.setColor(0.75, 0.75, 0);
        cilindarProp.setColor(0.75, 0.75, 0);
        triangleProp.setColor(0.75, 0.75, 0);
        cilindarHollowProp.setColor(0.75, 0.75, 0);
        lineProp.setColor(0, 0, 0);

        let kutY = 0;

        gl.enable(gl.DEPTH_TEST);
        gl.enable(gl.CULL_FACE);

        function iscrtaj() {
          gl.clearColor(0.1, 0.1, 0.1, 1);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
          gl.viewport(0, 0, platno1.width, platno1.height);

          // postavke svjetla i kamere
          gl.uniform3f(GPUprog1.u_izvorXYZ, 3.0, 4.0, 5.0);
          gl.uniform3f(GPUprog1.u_kameraXYZ, kamera.x, kamera.y, kamera.z);
          gl.uniform3f(GPUprog1.u_boja, 1.0, 1.0, 1.0);

          // view-projection matrica (ista za sve oblike u sceni)
          const vpLista = new Float32Array(mt.viewProjLista());
          gl.uniformMatrix4fv(GPUprog1.u_mTrans, false, vpLista);

          kutY = (kutY + 1) % 360;

          // crtaj cilindar (sredinji dio pilule)
          cilindar.draw(gl, GPUprog1, function (mt) {
            mt.rotirajZ(90);
            mt.rotirajX(kutY);
          });

          // gornja polulopta
          poluloptaGore.draw(gl, GPUprog1, function (mt) {
            mt.rotirajZ(90);
            mt.rotirajX(kutY);
            mt.pomakni(0, visinaCilindra / 2, 0);
          });

          // donja polulopta (zarotirana za 180° oko x-osi)
          poluloptaDolje.draw(gl, GPUprog1, function (mt) {
            mt.rotirajZ(90);
            mt.rotirajX(kutY);
            mt.pomakni(0, -visinaCilindra / 2, 0);
            mt.rotirajX(180);
          });

          elipsaCillindar.draw(gl, GPUprog1, function (mt) {
            mt.rotirajY(kutY);
            mt.pomakni(visinaCilindra / 3, visinaCilindra / 2, 0);
          });

          cilindarProp.draw(gl, GPUprog1, function (mt) {
            mt.rotirajZ(90);
            mt.rotirajX(kutY);
            mt.pomakni(0, visinaCilindra + 0.35, 0);
          });

          gl.disable(gl.CULL_FACE);
          const triCount = 3;
          const triStep = 360 / triCount;

          for (let i = 0; i < triCount; i++) {
            let step = i * triStep;
            triangleProp.draw(gl, GPUprog1, function (mt) {
              mt.rotirajY(kutY);
              const angle = ((2 * Math.PI) / 3) * i + (kutY * Math.PI) / 180.0; // 120° * i + kutY

              mt.pomakni(
                -(visinaCilindra + 0.75),
                radijus * Math.sin(angle),
                radijus * Math.cos(angle),
              );
              mt.rotirajX(90 - (step + kutY));
              mt.rotirajY(225);
            });
          }
          gl.enable(gl.CULL_FACE);

          gl.cullFace(gl.FRONT);
          cilindarHollowProp.draw(gl, GPUprog1, function (mt) {
            mt.rotirajZ(90);
            mt.rotirajX(kutY);
            mt.pomakni(0, 3, 0);
          });
          gl.cullFace(gl.BACK);
          cilindarHollowProp.draw(gl, GPUprog1, function (mt) {
            mt.rotirajZ(90);
            mt.rotirajX(kutY);
            mt.pomakni(0, 3, 0);
          });
          requestAnimationFrame(iscrtaj);
        }

        iscrtaj();
      }
    </script>

    <script id="vertex-shader" type="x-shader/x-vertex">
      #version 300 es
      in vec4 a_vrhXYZ;
      in vec3 a_normala;
      uniform mat4 u_mTrans;   // view-projection (P * K)
      uniform mat4 u_model;    // model matrica (M)
      uniform vec3 u_izvorXYZ;
      uniform vec3 u_kameraXYZ;
      out float v_svjetlina;

      void main() {
        // pozicija vrha u svjetskom koordinatnom sustavu
        vec4 worldPos = u_model * a_vrhXYZ;
        vec3 normala = mat3(u_model) * a_normala; // transformacija normale u svijetu

        // Lambertov zakon
        vec3 premaIzvoru = normalize(u_izvorXYZ - worldPos.xyz);
        v_svjetlina = dot(premaIzvoru, normala);

        // zakon refleksije
        float refleksija = 0.0;
        if (v_svjetlina > 0.0) {
          vec3 premaKameri = normalize(u_kameraXYZ - worldPos.xyz);
          vec3 reflektiranaZraka = reflect(-premaIzvoru, normala);
          refleksija = max(dot(reflektiranaZraka, premaKameri), 0.0);
          refleksija = pow(refleksija, 8.0);
        }

        v_svjetlina = v_svjetlina * 0.5 + refleksija * 0.5;
        gl_Position = u_mTrans * worldPos;
      }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
      #version 300 es
      precision highp float;
      uniform vec3 u_boja;
      uniform vec3 u_objColor;
      in float v_svjetlina;
      out vec4 bojaFragmenta;

      void main() {
        vec3 boja = v_svjetlina * u_boja * u_objColor;
        bojaFragmenta = vec4(boja, 1.0); // postavlja se boja fragmenta
      }
    </script>
  </head>

  <body>
    <h1>Kolokvij 2 – predložak</h1>
    <canvas
      id="slika1"
      width="500"
      height="500"
      style="border: 4px solid black"
    >
      Vaš preglednik ne podržava HTML5 canvas.
    </canvas>
  </body>
</html>

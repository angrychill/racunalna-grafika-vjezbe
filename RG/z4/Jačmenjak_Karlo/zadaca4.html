<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta charset="UTF-8" />
    <title>Zadaća 4</title>
    <script src="mt3d.js"></script>
    <script src="persp.js"></script>
    <style>
      body {
        font-family: system-ui, Arial, sans-serif;
        margin: 0;
        padding: 16px;
      }
      .page-nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 8px 0 16px;
      }
      .page-nav a {
        color: #06c;
        text-decoration: none;
        font-weight: 600;
      }
      .page-nav a:hover {
        text-decoration: underline;
      }
      h2 {
        margin: 12px 0 8px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }
      @media (min-width: 1100px) {
        .row {
          grid-template-columns: 1fr 1fr;
        }
      }
      canvas {
        border: 4px solid #000;
        width: 100%;
        max-width: 640px;
        height: auto;
      }
      .hint {
        color: #555;
        font-size: 0.9rem;
        margin: 0 0 8px;
      }
    </style>
    <script>
      function linija3D(ort, x1, y1, z1, x2, y2, z2, boja) {
        if (boja) ort.koristiBoju(boja);
        ort.postaviNa(x1, y1, z1);
        ort.linijaDo(x2, y2, z2);
        ort.povuciLiniju();
      }

      function kockaNa(ort, a, ox, oy, oz, boja) {
        const V = [
          [ox, oy, oz],
          [ox + a, oy, oz],
          [ox + a, oy + a, oz],
          [ox, oy + a, oz],
          [ox, oy, oz + a],
          [ox + a, oy, oz + a],
          [ox + a, oy + a, oz + a],
          [ox, oy + a, oz + a],
        ];
        const E = [
          [0, 1],
          [1, 2],
          [2, 3],
          [3, 0],
          [4, 5],
          [5, 6],
          [6, 7],
          [7, 4],
          [0, 4],
          [1, 5],
          [2, 6],
          [3, 7],
        ];
        ort.koristiBoju("black");
        for (const [i, j] of E) {
          const [x1, y1, z1] = V[i],
            [x2, y2, z2] = V[j];
          ort.postaviNa(x1, y1, z1);
          ort.linijaDo(x2, y2, z2);
          ort.povuciLiniju();
        }
      }
      function animiraniY(t, amplitude = 1, offset = 0) {
        const float = Math.sin(t * 0.8) * 0.5;
        const wobble = Math.sin(t * 3.1) * 0.12;
        const drift = Math.sin(t * 0.23) * Math.sin(t * 0.07) * 0.4;

        return offset + amplitude * (float + wobble + drift);
      }

      function initZadatak1() {
        const platno = document.getElementById("c1");
        if (!platno) {
          alert("Greška - nema platna!");
          return;
        }

        let canvasSize = 10;
        let camDist = 12;
        const persp = Persp.EqualX(
          platno,
          -canvasSize,
          canvasSize,
          camDist / 2
        );
        const a = 1;
        const mt3d = new MT3D();

        let gridDim = 8;
        let cMin = -gridDim + 0.5;
        let cMax = gridDim - 0.5;
        let speed = 16;
        let last = performance.now();
        let ax = 32;

        function frame(now) {
          const dt = (now - last) / 1000;
          last = now;
          const t = last / 1000;
          const zeros = Array(4).fill(0);

          mt3d.postaviKameru(
            Math.sin(t) * camDist,
            animiraniY(t, 16, 4),
            Math.cos(t) * camDist,
            ...zeros,
            1,
            0
          );

          persp.ocistiCanvas();
          for (let s = -gridDim; s < gridDim; s++) {
            linija3D(persp, cMin, 0, s + 0.5, cMax, 0, s + 0.5, "red");
            linija3D(persp, s + 0.5, 0, cMin, s + 0.5, 0, cMax, "red");
          }

          for (let i = 0; i < 5; i++) {
            kockaNa(persp, a, -0.5, i, -0.5, "black");
          }
          for (let j = 0; j < 2; j++) {
            kockaNa(persp, a, 0.5 + j, 4, -0.5, "black");
          }
          kockaNa(persp, a, 0.5, 2, -0.5);
          persp.trans(mt3d);
          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      }

      function initZadatak2() {
        const platno = document.getElementById("c2");
        if (!platno) {
          alert("Greška - nema platna!");
          return;
        }

        let canvasSize = 10;
        let camDist = 12;
        const persp = Persp.EqualX(
          platno,
          -canvasSize,
          canvasSize,
          camDist / 2
        );
        const a = 1;
        const mt3d = new MT3D();

        let gridDim = 8;
        let cMin = -gridDim + 0.5;
        let cMax = gridDim - 0.5;
        let speed = 16;
        let last = performance.now();
        let ax = 32;

        function frame(now) {
          const dt = (now - last) / 1000;
          last = now;
          const t = last / 1000;
          const zeros = Array(4).fill(0);

          const r = 28;
          const minAmp = 0.15;
          const amp = minAmp + ((1 - minAmp) * (1 - Math.cos(t + 1))) / 2;

          const X = r * amp * Math.cos(t);
          const Y = 2 * Math.cos(Math.PI / 2 + t) + 3.5;
          const Z = r * amp * Math.sin(t);

          mt3d.postaviKameru(X, Y, Z, ...zeros, 1, 0);

          persp.ocistiCanvas();
          for (let s = -gridDim; s < gridDim; s++) {
            linija3D(persp, cMin, 0, s + 0.5, cMax, 0, s + 0.5, "red");
            linija3D(persp, s + 0.5, 0, cMin, s + 0.5, 0, cMax, "red");
          }

          for (let i = 0; i < 5; i++) {
            kockaNa(persp, a, -0.5, i, -0.5, "black");
          }
          for (let j = 0; j < 2; j++) {
            kockaNa(persp, a, 0.5 + j, 4, -0.5, "black");
          }
          kockaNa(persp, a, 0.5, 2, -0.5);
          persp.trans(mt3d);
          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      }

      function initZadatak3() {
        const platno = document.getElementById("c3");
        if (!platno) {
          alert("Greška - nema platna!");
          return;
        }

        let canvasSize = 10;
        let camDist = 12;
        const persp = Persp.EqualX(
          platno,
          -canvasSize,
          canvasSize,
          camDist / 2
        );
        const a = 1;
        const mt3d = new MT3D();

        let gridDim = 8;
        let cMin = -gridDim + 0.5;
        let cMax = gridDim - 0.5;
        let speed = 16;
        let last = performance.now();
        let ax = 32;

        const randBetween = (min, max) => min + Math.random() * (max - min);
        const randomPos = () => ({
          x: randBetween(cMin, cMax),
          y: randBetween(cMin, cMax),
          z: randBetween(cMin, cMax),
        });

        //https://easings.net/#easeInOutQuad
        const easeInOutQuad = (u) =>
          u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;

        let from = { x: 0, y: 3, z: 5 };
        let to = randomPos();
        let moveStart = performance.now();
        let moveDur = 2000 + Math.random() * 2000;

        function frame(now) {
          const dt = (now - last) / 1000;
          last = now;
          const zeros = Array(4).fill(0);

          if (now - moveStart >= moveDur) {
            from = to;
            to = randomPos();
            moveStart = now;
            moveDur = 2000 + Math.random() * 2000;
          }

          const u = Math.min(1, (now - moveStart) / moveDur);
          const e = easeInOutQuad(u);
          const X = from.x + (to.x - from.x) * e;
          const Y = from.y + (to.y - from.y) * e;
          const Z = from.z + (to.z - from.z) * e;

          mt3d.postaviKameru(X, Y, Z, ...zeros, 1, 0);

          persp.ocistiCanvas();
          for (let s = -gridDim; s < gridDim; s++) {
            linija3D(persp, cMin, 0, s + 0.5, cMax, 0, s + 0.5, "red");
            linija3D(persp, s + 0.5, 0, cMin, s + 0.5, 0, cMax, "red");
          }

          for (let i = 0; i < 5; i++) {
            kockaNa(persp, a, -0.5, i, -0.5, "black");
          }
          for (let j = 0; j < 2; j++) {
            kockaNa(persp, a, 0.5 + j, 4, -0.5, "black");
          }
          kockaNa(persp, a, 0.5, 2, -0.5);
          persp.trans(mt3d);
          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      }

      window.onload = () => {
        initZadatak1();
        initZadatak2();
        initZadatak3();
      };
    </script>
  </head>
  <body>
    <h1>Zadaća 4</h1>
    <nav class="page-nav">
      <a href="#zadatak1">Zadatak 1</a>
      <a href="#zadatak2">Zadatak 2</a>
      <a href="#zadatak3">Zadatak 3</a>
    </nav>
    <div class="row">
      <section id="zadatak1">
        <h2>Zadatak 1</h2>
        <canvas id="c1" width="700" height="700"></canvas>
      </section>
      <section id="zadatak2">
        <h2>Zadatak 2</h2>
        <canvas id="c2" width="700" height="700"></canvas>
      </section>
      <section id="zadatak3">
        <h2>Zadatak 3 – Test anomalije</h2>
        <canvas id="c3" width="700" height="700"></canvas>
      </section>
    </div>
  </body>
</html>

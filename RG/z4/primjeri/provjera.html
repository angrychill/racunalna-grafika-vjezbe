<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <title>Provjera – postaviKameru</title>
    <script src="otho.js"></script>
    <script src="mt3d.js"></script>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, Arial, sans-serif; margin: 0; padding: 16px; }
      h1 { margin: 8px 0 12px; font-size: 1.3rem; }
      .row { display: grid; grid-template-columns: 1fr; gap: 16px; }
      @media (min-width: 1000px) { .row { grid-template-columns: 1fr 1fr; } }
      canvas { border: 3px solid #000; width: 100%; max-width: 720px; height: auto; background: #fff; }
      fieldset { border: 1px solid #888; border-radius: 6px; padding: 8px; margin: 0 0 12px; }
      legend { padding: 0 4px; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      label { display: flex; flex-direction: column; font-size: 12px; gap: 4px; }
      input[type="number"] { font: inherit; padding: 6px; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      button { padding: 6px 10px; font: inherit; cursor: pointer; }
      .hint { color: #555; font-size: 0.9rem; margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <h1>Provjera metode postaviKameru</h1>
    <div class="row">
      <div>
        <canvas id="c" width="900" height="620"></canvas>
      </div>
      <div>
        <fieldset>
          <legend>Parametri kamere</legend>
          <div class="grid">
            <label>x0 (eye.x)
              <input id="x0" type="number" step="0.1" value="8" />
            </label>
            <label>y0 (eye.y)
              <input id="y0" type="number" step="0.1" value="8" />
            </label>
            <label>z0 (eye.z)
              <input id="z0" type="number" step="0.1" value="8" />
            </label>

            <label>x1 (center.x)
              <input id="x1" type="number" step="0.1" value="0" />
            </label>
            <label>y1 (center.y)
              <input id="y1" type="number" step="0.1" value="0" />
            </label>
            <label>z1 (center.z)
              <input id="z1" type="number" step="0.1" value="0" />
            </label>

            <label>Vx (up.x)
              <input id="vx" type="number" step="0.1" value="0" />
            </label>
            <label>Vy (up.y)
              <input id="vy" type="number" step="0.1" value="1" />
            </label>
            <label>Vz (up.z)
              <input id="vz" type="number" step="0.1" value="0" />
            </label>
          </div>
        </fieldset>
        <div class="controls">
          <button id="apply">Primijeni</button>
          <button id="iso">Izometrijski</button>
          <button id="front">Sprijeda</button>
          <button id="top">Odozgo</button>
          <button id="side">S desne</button>
          <button id="reset">Reset</button>
        </div>
        <p class="hint">Mijenjaj parametre i klikni „Primijeni“, ili koristi predefinirane poglede.
          Crtaju se osi (x=crveno, y=zelena, z=plava) i par kocaka.</p>
      </div>
    </div>

    <script>
      function linija3D(ort, x1, y1, z1, x2, y2, z2, boja) {
        if (boja) ort.koristiBoju(boja);
        ort.postaviNa(x1, y1, z1);
        ort.linijaDo(x2, y2, z2);
        ort.povuciLiniju();
      }

      function kockaNa(ort, a, ox, oy, oz, boja) {
        const V = [
          [ox, oy, oz],
          [ox + a, oy, oz],
          [ox + a, oy + a, oz],
          [ox, oy + a, oz],
          [ox, oy, oz + a],
          [ox + a, oy, oz + a],
          [ox + a, oy + a, oz + a],
          [ox, oy + a, oz + a],
        ];
        const E = [
          [0, 1], [1, 2], [2, 3], [3, 0],
          [4, 5], [5, 6], [6, 7], [7, 4],
          [0, 4], [1, 5], [2, 6], [3, 7],
        ];
        if (boja) ort.koristiBoju(boja);
        for (const [i, j] of E) {
          const [x1, y1, z1] = V[i], [x2, y2, z2] = V[j];
          ort.postaviNa(x1, y1, z1);
          ort.linijaDo(x2, y2, z2);
          ort.povuciLiniju();
        }
      }

      function osi(ort, L = 6) {
        ort.koristiBoju("red");   linija3D(ort, 0, 0, 0, L, 0, 0);
        ort.koristiBoju("green"); linija3D(ort, 0, 0, 0, 0, L, 0);
        // z-os: crtamo prema -Z da vizual bude "udaljava se"
        ort.koristiBoju("blue");  linija3D(ort, 0, 0, 0, 0, 0, -L);
      }

      const canvas = document.getElementById("c");
      const ort = Ortho.EqualX(canvas, -10, 10);
      const T = new MT3D();

      function draw() {
        ort.ocistiCanvas();
        ort.trans(T);
        // Mreza po x-z (y=0)
        ort.koristiBoju("#ccc");
        for (let i = -10; i <= 10; i += 2) {
          linija3D(ort, i, 0, -10, i, 0, 10);
          linija3D(ort, -10, 0, i, 10, 0, i);
        }
        // Osi i par kocaka
        osi(ort, 6);
        kockaNa(ort, 2, 0, 0, 0, "#222");
        kockaNa(ort, 1.5, 4, 0, 2, "#444");
        kockaNa(ort, 1.5, -4, 0, -2, "#444");
      }

      function setCam(x0, y0, z0, x1, y1, z1, vx, vy, vz) {
        T.identitet();
        if (typeof T.postaviKameru === "function") {
          T.postaviKameru(x0, y0, z0, x1, y1, z1, vx, vy, vz);
        }
        draw();
      }

      function readNumber(id) {
        return parseFloat(document.getElementById(id).value);
      }

      function applyFromInputs() {
        setCam(
          readNumber("x0"), readNumber("y0"), readNumber("z0"),
          readNumber("x1"), readNumber("y1"), readNumber("z1"),
          readNumber("vx"), readNumber("vy"), readNumber("vz")
        );
      }

      function setInputs(vals) {
        const ids = ["x0", "y0", "z0", "x1", "y1", "z1", "vx", "vy", "vz"];
        ids.forEach((id, i) => (document.getElementById(id).value = vals[i]));
      }

      document.getElementById("apply").addEventListener("click", applyFromInputs);
      document.getElementById("iso").addEventListener("click", () => {
        setInputs([8, 8, 8, 0, 0, 0, 0, 1, 0]);
        applyFromInputs();
      });
      document.getElementById("front").addEventListener("click", () => {
        setInputs([0, 0, 10, 0, 0, 0, 0, 1, 0]);
        applyFromInputs();
      });
      document.getElementById("top").addEventListener("click", () => {
        setInputs([0, 10, 0, 0, 0, 0, 0, 0, -1]);
        applyFromInputs();
      });
      document.getElementById("side").addEventListener("click", () => {
        setInputs([10, 0, 0, 0, 0, 0, 0, 1, 0]);
        applyFromInputs();
      });
      document.getElementById("reset").addEventListener("click", () => {
        setInputs([8, 8, 8, 0, 0, 0, 0, 1, 0]);
        applyFromInputs();
      });

      // inicijalni pogled
      setInputs([8, 8, 8, 0, 0, 0, 0, 1, 0]);
      applyFromInputs();
    </script>
  </body>
  </html>

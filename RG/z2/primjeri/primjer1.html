<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta charset="UTF-8" />
    <title>Primjer 1</title>
    <style>
      body {
        font-family: system-ui, Arial, sans-serif;
      }
      nav {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .btn {
        cursor: pointer;
        padding: 6px 10px;
        border: 1px solid #444;
        background: #f7f7f7;
        border-radius: 4px;
      }
      .btn.active {
        background: #e0eaff;
        border-color: #2b5ad8;
      }
      #controls {
        margin: 10px 0 12px;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
      }
      .ctl {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ctl label {
        font-weight: 600;
      }
      .ctl output {
        min-width: 60px;
        display: inline-block;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <canvas
      id="canvasZ2"
      width="600"
      height="600"
      style="border: 4px solid black"
    >
      Vaš preglednik ne podržava HTML5 canvas.
    </canvas>
  </body>
  <script src="gks.js"></script>
  <script>
    window.addEventListener("load", function () {
      const platno = document.getElementById("canvasZ2");
      if (!platno) {
        alert("Greška - nema platna!");
        return;
      }
      const xmin = -5,
        xmax = 5,
        ymin = -5,
        ymax = 5;
      const gks = new GKS(platno, xmin, xmax, ymin, ymax);

      gks.koristiBoju("black");
      gks.postaviNa(0, ymin);
      gks.linijaDo(0, ymax);
      gks.povuciLiniju();
      gks.postaviNa(xmin, 0);
      gks.linijaDo(xmax, 0);
      gks.povuciLiniju();

      let delta = 0.01;
      let r = 4;
      gks.koristiBoju("red");
      gks.postaviNa(r, 0);
      for (let i = 0; i <= 2 * Math.PI; i = i + delta) {
        let x = r * Math.cos(i);
        let y = r * Math.sin(i);
        console.log(x, y);
        gks.linijaDo(x, y);
      }
      gks.povuciLiniju();

      let r1 = 4;
      let r2 = 2;
      gks.koristiBoju("blue");
      gks.postaviNa(r1, 0);
      for (let i = 0; i <= 2 * Math.PI; i = i + delta) {
        let x = r1 * Math.cos(i);
        let y = r2 * Math.sin(i);
        gks.linijaDo(x, y);
      }
      gks.povuciLiniju();
    });
  </script>
</html>
